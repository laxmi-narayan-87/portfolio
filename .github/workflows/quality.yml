name: Static site quality checks

on:
  push:
    branches: [portfolio]
  pull_request:
    branches: [portfolio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portfolio structure and security baseline
        run: python .github/scripts/check_site.py
