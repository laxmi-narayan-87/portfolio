name: Static site quality checks

on:
  push:
    branches: [portfolio]
  pull_request:
    branches: [portfolio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Validate portfolio structure and security baseline
        run: python .github/scripts/check_site.py
